[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pq-dna"
version = "0.1.0"
description = "Firmware-resident lifetime power-quality stress signatures with on-device component health scoring"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Sourav Sahu" }]
maintainers = [{ name = "Microsoft Corporation" }]
keywords = [
    "power-quality",
    "predictive-maintenance",
    "prognostics",
    "remaining-useful-life",
    "embedded",
    "fixed-point",
    "edge-ai",
    "smart-meter",
    "IEEE-1159",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
plots = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/microsoft/pq-dna"
Repository = "https://github.com/microsoft/pq-dna"
Issues = "https://github.com/microsoft/pq-dna/issues"

[project.scripts]
pqdna-demo = "pqdna.demo:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
